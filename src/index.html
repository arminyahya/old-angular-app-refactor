<!doctype html>
<html lang="en" ng-app="legacyApp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legacy AngularJS App</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body ng-controller="MainCtrl as vm">
    <app-header></app-header>

    <task-panel
      tasks="vm.tasks"
      filtered-tasks="vm.filteredTasks"
      new-task-title="vm.newTaskTitle"
      new-task-priority="vm.newTaskPriority"
      filter-state="vm.filterState"
      search-text="vm.searchText"
      open-count="vm.openCount"
      done-count="vm.doneCount"
      on-add="vm.addTask()"
      on-remove="vm.removeTask(task)"
      on-apply-filter="vm.applyFilter()"
      on-persist="vm.persist()">
    </task-panel>

    <users-panel users="vm.users" on-load="vm.loadUsers()"></users-panel>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
    <script src="modules/core.module.js"></script>
    <script src="modules/tasks/tasks.module.js"></script>
    <script src="modules/users/users.module.js"></script>
    <script src="app.js"></script>
    <script src="services/taskService.js"></script>
    <script src="services/userService.js"></script>
    <script src="components/appHeader.js"></script>
    <script src="components/taskPanel.js"></script>
    <script src="components/usersPanel.js"></script>
    <script src="components/taskStats.js"></script>
  </body>
</html>
