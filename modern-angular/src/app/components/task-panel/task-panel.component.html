<section class="panel">
  <h2>Tasks</h2>
  <form (ngSubmit)="add.emit()">
    <input
      type="text"
      [(ngModel)]="newTaskTitle"
      name="newTaskTitle"
      placeholder="New task" />
    <select
      [(ngModel)]="newTaskPriority"
      name="newTaskPriority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="filters">
    <label>
      Show:
      <select
        [(ngModel)]="filterState"
        name="filterState">
        <option value="all">All</option>
        <option value="open">Open</option>
        <option value="done">Done</option>
      </select>
    </label>
    <label>
      Search:
      <input
        type="text"
        [(ngModel)]="searchText"
        name="searchText" />
    </label>
  </div>

  <ul class="task-list">
    @for (task of filteredTasks; track task.id ?? task.title) {
      <li
        task-item
        [task]="task"
        (toggleDone)="toggleDone.emit($event)"
        (remove)="remove.emit($event)">
      </li>
    }
  </ul>

  <task-stats [open]="openCount" [done]="doneCount" [total]="tasks.length"></task-stats>
</section>
