<app-header></app-header>

<task-panel
  [tasks]="tasks()"
  [filteredTasks]="filteredTasks()"
  [(newTaskTitle)]="newTaskTitle"
  [(newTaskPriority)]="newTaskPriority"
  [(filterState)]="filterState"
  [(searchText)]="searchText"
  [openCount]="openCount()"
  [doneCount]="doneCount()"
  [autoPrioritizing]="isAutoPrioritizing()"
  [autoPriorityStatus]="autoPriorityStatus()"
  (add)="addTask()"
  (autoPrioritize)="autoPrioritizeTasks()"
  (remove)="removeTask($event)"
  (toggleDone)="toggleDone($event)">
</task-panel>

<users-panel [users]="users()" (load)="loadUsers()"></users-panel>
