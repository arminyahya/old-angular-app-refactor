<app-header></app-header>

<task-panel
  [tasks]="tasks"
  [filteredTasks]="filteredTasks"
  [newTaskTitle]="newTaskTitle"
  (newTaskTitleChange)="newTaskTitle = $event"
  [newTaskPriority]="newTaskPriority"
  (newTaskPriorityChange)="newTaskPriority = $event"
  [filterState]="filterState"
  (filterStateChange)="filterState = $event"
  [searchText]="searchText"
  (searchTextChange)="searchText = $event"
  [openCount]="openCount"
  [doneCount]="doneCount"
  (add)="addTask()"
  (remove)="removeTask($event)"
  (toggleDone)="toggleDone()"
  (applyFilter)="applyFilter()">
</task-panel>

<users-panel [users]="users" (load)="loadUsers()"></users-panel>
